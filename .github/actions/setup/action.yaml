name: Setup action
description: Reusable action to setup node and install packages

inputs:
  registry-url:
    description: Optional npm registry URL. When set, configures auth for NODE_AUTH_TOKEN via actions/setup-node.
    required: false

runs:
  using: "composite"
  steps:

    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.16.0
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      name: Install pnpm
      with:
        install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      run: |
        pnpm_cache_dir="$(pnpm store path)"
        echo "pnpm_cache_dir=${pnpm_cache_dir}" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
        key: pnpm-store-${{ hashFiles('**/package.json') }}
        restore-keys: |
          pnpm-store-

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Cache turbo
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

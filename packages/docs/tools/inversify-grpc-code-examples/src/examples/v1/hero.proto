syntax = "proto3";

package hero.v1;

service HeroService {
  rpc GetHero (HeroRequest) returns (HeroResponse);
}

service HeroUploadService {
  rpc UploadHeroes (stream UploadRequest) returns (UploadResponse);
}

service HeroListService {
  rpc ListHeroes (HeroRequest) returns (stream HeroResponse);
}

service HeroChatService {
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

message HeroRequest {
  string id = 1;
}

message HeroResponse {
  string name = 1;
}

message UploadRequest {
  string name = 1;
}

message UploadResponse {
  repeated string names = 1;
}

message ChatMessage {
  string text = 1;
}

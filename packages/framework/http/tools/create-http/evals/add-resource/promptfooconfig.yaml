description: Evaluate the generated add-resource agent skill

prompts:
  - '{{request}}'

providers:
  - id: openai:codex-sdk
    config:
      working_dir: '{{workspaceDir}}'
      skip_git_repo_check: true
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      enable_streaming: true

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - type: skill-used
      value: add-resource
    - type: javascript
      value: file://assertResource.mjs

tests: file://testCases.yaml

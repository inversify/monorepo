- description: Add a Product CRUD resource (code-first)
  vars: &product-vars
    workspaceDir: ./workspaces/code-first/product
    apiStyle: code-first
    resourceDirectory: product
    resourceName: Product
    routePrefix: /v1/products
    requiresCascade: 'false'
    modelFields: '{"Product":["id","sku","name","description","price_cents","active","created_at","updated_at","deleted_at"]}'
    fieldRules: '{"Product":{"id":["String","@id","@default(uuid())"],"sku":["String","@unique"],"name":["String"],"description":["String?"],"price_cents":["Int"],"active":["Boolean","@default(true)"],"created_at":["DateTime"],"updated_at":["DateTime"],"deleted_at":["DateTime?"]}}'
    expectedDecorators: '["Post","Get","Patch","Delete"]'
    request: >-
      Add a Product resource using the add-resource skill. A product has a UUID id,
      unique sku, name, optional description, integer priceCents, active boolean
      defaulting to true, createdAt, updatedAt, and soft deletion. Persist columns in
      snake_case. Add create, get by
      id, paginated list, update, and delete endpoints under /v1/products. No auth is
      required. Finish the implementation and run the project's normal validation.

- description: Add a Product CRUD resource (schema-first)
  vars:
    <<: *product-vars
    workspaceDir: ./workspaces/schema-first/product
    apiStyle: schema-first

- description: Add an Order aggregate with line items (code-first)
  vars: &order-vars
    workspaceDir: ./workspaces/code-first/order
    apiStyle: code-first
    resourceDirectory: order
    resourceName: Order
    routePrefix: /v1/orders
    requiresCascade: 'true'
    modelFields: '{"Order":["id","order_number","customer_email","status","created_at","updated_at","items"],"OrderItem":["id","order_id","product_sku","quantity","unit_price_cents","order"]}'
    fieldRules: '{"Order":{"id":["String","@id","@default(uuid())"],"order_number":["String","@unique"],"customer_email":["String"],"status":["String"],"created_at":["DateTime"],"updated_at":["DateTime"],"items":["OrderItem[]"]},"OrderItem":{"id":["String","@id","@default(uuid())"],"order_id":["String","@db.Uuid"],"product_sku":["String"],"quantity":["Int"],"unit_price_cents":["Int"],"order":["Order","@relation","onDelete: Cascade"]}}'
    expectedDecorators: '["Post","Get"]'
    nestedField: items
    request: >-
      Add an Order resource using the add-resource skill. An order has a UUID id,
      unique orderNumber, customerEmail, status, createdAt, and updatedAt. Each order
      owns one or more OrderItem records with a UUID id, productSku, quantity, and
      integer unitPriceCents. Deleting an order must delete its items. Add create,
      get by id, and paginated list endpoints under /v1/orders. Create accepts its
      items and get responses include them. Persist columns in snake_case. No auth,
      filtering, or soft deletion is required. Finish the implementation and run the
      project's normal validation.

- description: Add an Order aggregate with line items (schema-first)
  vars:
    <<: *order-vars
    workspaceDir: ./workspaces/schema-first/order
    apiStyle: schema-first
